name: Complete unsigned package checks

# 节点图：
#   inputs（只还原、不重建运行时）─┬─► native-repro（描述符字节、第三方声明、原生可复现）
#                                  └─► package（verify-stability --stage package 的单一回执）
# package 节点保持一次完整回执：单测 / Lint / 资产 / 包检查共享同一源码快照，
# 由 tools/verify-ci-package.py 按 run 路径与 commit 复核。
on:
  workflow_dispatch:
    inputs:
      asset_bundle_url:
        description: Immutable HTTPS offline input bundle（留空则用 ci/sunset-inputs.lock.json）
        required: false
        type: string
        default: ''
      asset_bundle_sha256:
        description: Fixed SHA-256 for that input bundle（与 URL 成对；留空则用 lock）
        required: false
        type: string
        default: ''
      asset_archive_format:
        description: Layout of the verified input archive
        required: false
        type: choice
        default: bundle
        options: [bundle, source-archive]
permissions:
  contents: read
jobs:
  inputs:
    uses: ./.github/workflows/_node-inputs.yml
    with:
      asset_bundle_url: ${{ inputs.asset_bundle_url }}
      asset_bundle_sha256: ${{ inputs.asset_bundle_sha256 }}
      asset_archive_format: ${{ inputs.asset_archive_format }}
      rebuild_runtime: false
      artifact: package-inputs
  package:
    name: Build unsigned APK
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/android-sdk
        with:
          ndk: 'true'
      - uses: ./.github/actions/restore-handoff
        with:
          artifact: ${{ needs.inputs.outputs.artifact }}
          fixture: 'true'
      # 直接出包：不做单测和 Lint。
      # 这两个是上游为「正式发布」设的门，我们是共存版自用，
      # 一个 lint 警告不该挡住能装的包。
      - name: Assemble unsigned release APK
        id: assemble
        run: |
          java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain \
            :app:assembleStandardRelease -Pdsha.unsignedPackage=true --console=plain

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: UNSIGNED-NOT-FOR-INSTALLATION
          path: app/build/outputs/apk/standard/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 14

  # ── 共存版适配：用我们自己的密钥签名，产出可直接安装的 APK ──
  # su 原版到这里就结束了（只出未签名包）。这一段是新增的适配节点。
  sign-coexist:
    name: Sign installable APK (own keystore)
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UNSIGNED-NOT-FOR-INSTALLATION
          path: ${{ runner.temp }}/unsigned

      - name: Restore own keystore
        env:
          KS_B64: ${{ secrets.DSHA_MOD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.DSHA_MOD_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.DSHA_MOD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          [ -n "${KS_B64:-}" ] || { echo "::error::缺少 DSHA_MOD_KEYSTORE_BASE64"; exit 1; }
          umask 077
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/sign.jks"
          echo "SUCCESS" > /dev/null

      - name: zipalign and sign
        env:
          KS_PASS: ${{ secrets.DSHA_MOD_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.DSHA_MOD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          in=$(find "$RUNNER_TEMP/unsigned" -name '*-unsigned.apk' | head -1)
          [ -n "$in" ] || { echo "::error::找不到未签名 APK"; exit 1; }
          out="$RUNNER_TEMP/signed"
          mkdir -p "$out"
          "$BT/zipalign" -p -f 4 "$in" "$out/aligned.apk"
          # Android 11+ 只用 v2/v3：v1 会把包顶过部分机型约 300MB 的安装上限
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/sign.jks" \
            --ks-key-alias "${KS_ALIAS:-dsha-mod}" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KS_PASS" \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$out/DSHA-dsha.v2-coexist.apk" \
            "$out/aligned.apk"
          "$BT/apksigner" verify --print-certs "$out/DSHA-dsha.v2-coexist.apk" | head -6
          rm -f "$RUNNER_TEMP/sign.jks"

      - name: Verify package identity
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK="$RUNNER_TEMP/signed/DSHA-dsha.v2-coexist.apk"
          "$BT/aapt2" dump badging "$APK" | head -3
          pkg=$("$BT/aapt2" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          [ "$pkg" = "dsga.mod" ] || { echo "::error::包名不是 dsga.mod，实际 $pkg"; exit 1; }
          {
            echo "### DSHA 共存版 dsha.v2"
            echo "- 包名：\`dsga.mod\`"
            echo "- 大小：$(stat -c%s "$APK") 字节"
            echo "- SHA-256：\`$(sha256sum "$APK" | cut -d\  -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: DSHA-dsha.v2-coexist
          path: ${{ runner.temp }}/signed/DSHA-dsha.v2-coexist.apk
          if-no-files-found: error
          retention-days: 30
